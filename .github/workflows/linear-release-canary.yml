# Tracks the upcoming @bazza-ui/react canary as a release in Linear's
# "React (Canary)" scheduled pipeline.
#
# Each push to `canary` that carries a pending @bazza-ui/react changeset adds
# its issues to the open Linear release named after the upcoming canary
# version (e.g. 0.1.0-canary.16). publish-canary.yml completes that release
# once the version is published to npm.

name: Linear Release (Canary)

on:
  push:
    branches:
      - canary
    paths:
      - "packages/react/**"
      - ".changeset/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  sync:
    name: Sync upcoming @bazza-ui/react canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve upcoming @bazza-ui/react version
        id: next
        run: |
          # --output is resolved relative to the repository root.
          bunx changeset status --output=changeset-status.json || true
          if [ ! -f changeset-status.json ]; then
            echo "No pending changesets."
            exit 0
          fi

          version=$(jq -r '.releases[] | select(.name == "@bazza-ui/react" and .type != "none") | .newVersion' changeset-status.json)
          rm changeset-status.json
          if [ -z "$version" ]; then
            echo "@bazza-ui/react has no pending release."
            exit 0
          fi

          # Scan from the last published @bazza-ui/react tag, so every sync
          # covers the whole cycle and the first sync needs no backfill.
          base_ref=$(git describe --tags --abbrev=0 --match '@bazza-ui/react@*' HEAD 2>/dev/null || true)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base-ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "Upcoming version: $version (scanning from ${base_ref:-the current commit})"

      - name: Sync Linear release
        if: steps.next.outputs.version != ''
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_REACT_CANARY_KEY }}
          version: ${{ steps.next.outputs.version }}
          name: ${{ steps.next.outputs.version }}
          base_ref: ${{ steps.next.outputs.base-ref }}
          include_paths: packages/react/**

name: CI

on:
  pull_request:
    branches:
      - main
      - canary
      - rc
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint (Biome)
        run: bunx biome check .

      # oxlint loads the `bazza/*` rules from `tooling/lint` as JS plugins, so
      # it needs the workspace installed above.
      - name: Lint packages/react and packages/menu-core (oxlint)
        run: bun run lint:oxlint

      # Lists every allowlisted file and inline exception (also in the job
      # summary). Fails only on a malformed exception comment.
      - name: Report lint exceptions
        if: ${{ !cancelled() }}
        run: bun run lint:exceptions

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bunx --bun turbo run type-check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `@bazza-ui/react` runs `*.browser.test.tsx` files in headless Chromium.
      - name: Get Playwright version
        id: playwright-version
        working-directory: packages/react
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/react
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/react
        run: bunx playwright install-deps chromium

      - name: Run tests
        run: bun run test

  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bundles each menu family entry from `src`, so it needs no build. Adds
      # a table to the job summary, marking entries over their budget in
      # `packages/react/bench/size/budgets.json`. Report-only while the menu
      # family v4 engine is rebuilt; budgets gate again once it lands.
      - name: Check menu family bundle size
        run: bun run --cwd packages/react bench:size
        env:
          BENCH_SIZE_REPORT_ONLY: "1"

      # bench:size bundles from `src`, where a workspace package resolves
      # either way. This builds `dist` and checks it imports only packages
      # `@bazza-ui/react` declares, so nothing private is left unbundled.
      - name: Build @bazza-ui/react
        run: bunx --bun turbo run build --filter @bazza-ui/react

      - name: Check dist imports only declared packages
        run: bun run --cwd packages/react bench:dist-imports

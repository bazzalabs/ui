name: Publish Snapshot Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Which packages to publish"
        required: true
        type: choice
        options:
          - filters
          - action-menu
          - both
        default: "both"
      branch:
        description: "Branch to publish from"
        required: false
        default: "canary"

jobs:
  publish:
    name: Publish snapshot release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GH_ASSETS_READONLY_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bunx --bun turbo run build --filter='./packages/*'

      - name: Create temporary changeset for snapshot
        run: |
          # Only create temporary changeset if none exist
          if [ ! "$(ls -A .changeset/*.md 2>/dev/null | grep -v README)" ]; then
            # Create changeset for selected packages only
            if [ "${{ inputs.packages }}" = "filters" ]; then
              cat <<EOF > .changeset/snapshot-release.md
          ---
          "@bazza-ui/filters": patch
          ---

          Snapshot release for testing
          EOF
            elif [ "${{ inputs.packages }}" = "action-menu" ]; then
              cat <<EOF > .changeset/snapshot-release.md
          ---
          "@bazza-ui/action-menu": patch
          ---

          Snapshot release for testing
          EOF
            else
              cat <<EOF > .changeset/snapshot-release.md
          ---
          "@bazza-ui/action-menu": patch
          "@bazza-ui/filters": patch
          ---

          Snapshot release for testing
          EOF
            fi
          fi

      - name: Create snapshot versions
        run: bunx changeset version --snapshot snapshot && bun update

      - name: Setup npmrc
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Publish snapshot to npm
        run: |
          if [ "${{ inputs.packages }}" = "filters" ]; then
            cd packages/filters && bun publish --tag snapshot
          elif [ "${{ inputs.packages }}" = "action-menu" ]; then
            cd packages/action-menu && bun publish --tag snapshot
          else
            cd packages/filters && bun publish --tag snapshot
            cd ../action-menu && bun publish --tag snapshot
          fi

      - name: Summary
        run: |
          echo "### ✅ Published snapshot release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Packages:** ${{ inputs.packages }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with: \`npm install @bazza-ui/[package]@snapshot\`" >> $GITHUB_STEP_SUMMARY

# Worktrunk project config for @bazza-ui.
# Docs: https://worktrunk.dev/config/ and https://worktrunk.dev/hook/

# Run once when a new worktree is created. These block until complete so any
# editor or agent launched with `wt switch -x` sees local env files and deps.
[pre-start]
env = """
src={{ primary_worktree_path }}
dst={{ worktree_path }}

[ -f "$src/.env.local" ] && cp "$src/.env.local" "$dst/.env.local" || true
[ -f "$src/apps/web/.env.local" ] && cp "$src/apps/web/.env.local" "$dst/apps/web/.env.local" || true
"""
install = "bun install"

# Don't seed new worktrees with machine/path-specific build caches. A copied
# Turbopack dev cache (apps/web/.next-dev) references the source worktree's
# absolute paths and sends `next dev` into an invalidation storm (tens of GB
# of memory, server never ready). node_modules/dist still copy — that's the
# intended cold-start win, reconciled by the `bun install` pre-start hook.
[step.copy-ignored]
exclude = [
  ".next/",
  ".next-dev/",
  ".turbo/",
  "base-ui/",
  ".osgrep/",
  ".claude/",
  ".claude/settings.local.json",
  ".DS_Store",
  "tsconfig.tsbuildinfo",
]

[aliases]
# Per-worktree replacement for the old `bun run wt new --release <type>` flag.
# Usage: `wt release stable`, `wt release canary`, or `wt release rc`.
release = """
set -- {{ args }}
release_type=${1:-}
env_file={{ worktree_path }}/apps/web/.env.local

case "$release_type" in
  stable|canary|rc) ;;
  *)
    echo 'usage: wt release stable|canary|rc' >&2
    exit 1
    ;;
esac

touch "$env_file"
tmp_file=$(mktemp)
awk -v release_type="$release_type" '
  BEGIN { quote = sprintf("%c", 34); replaced = 0 }
  /^NEXT_PUBLIC_RELEASE_TYPE=/ {
    print "NEXT_PUBLIC_RELEASE_TYPE=" quote release_type quote
    replaced = 1
    next
  }
  { print }
  END {
    if (!replaced) {
      print "NEXT_PUBLIC_RELEASE_TYPE=" quote release_type quote
    }
  }
' "$env_file" >"$tmp_file"
mv "$tmp_file" "$env_file"

echo "Set NEXT_PUBLIC_RELEASE_TYPE=$release_type in $env_file"
"""

[list]
# Portless registers https://<last-branch-segment>.bazza-ui.localhost for
# worktrees and bare https://bazza-ui.localhost for the trunk worktree.
# Best-effort: portless truncates labels >63 chars with a hash suffix, which
# this template can't reproduce — `portless list` is the source of truth.
url = "https://{% if branch != 'main' and branch != 'canary' %}{{ branch | split('/') | last }}.{% endif %}bazza-ui.localhost"
